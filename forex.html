<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fintech Thing 2</title>
    <link rel = "stylesheet" href = "style.css" />
</head>
<body>

    <div class = "container">
           <hr />

    <h2> Currency </h2>

    <div class = "calculator">
        <input type = "number" id = "fxAmount" placeholder = "Amount">

        <select id = "fxCurrency">
            <option value = "USD"> USD </option>
            <option value = "EUR"> EUR </option>
            <option value = "GBP"> GBP </option>
        </select>

        <select id = "fxDirection">
            <option value = "sell"> Foreign → LKR (Sell) </option>
            <option value = "buy"> LKR → Foreign (Buy) </option>
        </select>

        <button id = "fxCompareBtn"> Compare Rates </button>
    </div>

    <table id = "fxTable">
        <thead>
            <tr>
                <th> Select </th>
                <th> Bank </th>
                <th> Buy Rate </th>
                <th> Sell Rate </th>
                <th> Spread </th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <table id = "fxComparisonTable">
        <thead>
            <tr>
                <th> Bank </th>
                <th> Converted Amount </th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <hr />

   
    </div>

    <script src = "js/script.js"> </script>
    <script src = "js/loan.js"> </script>
    <script src = "js/fx.js"> </script>
    <script src = "js/tax.js"> </script>
    
</body>
</html>
